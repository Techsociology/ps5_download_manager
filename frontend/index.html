.meta{color:var(--dim);font-size:16px}.url{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;direction:ltr;text-align:start}

.srow .ctl{margin:4px 0}.srow .ctl select,.srow .ctl input[type=number]{min-width:140px}
.srow.dz{border-color:rgba(239,68,68,.25)}
.path{display:inline-block;max-width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:0 10px 8px 0;font-family:Menlo,Consolas,monospace;font-size:15px;color:var(--acc);word-break:break-all;direction:ltr}[dir=rtl] .path{margin:0 0 8px 10px}

.modal.on{display:block}#modal2{z-index:30}
.dlg{background:#111115;border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:28px 30px;width:100%;max-width:740px;margin:0 auto;box-shadow:0 0 100px rgba(0,0,0,.6)}
.dlg h2{margin:0 0 16px;font-size:27px;text-transform:uppercase;font-style:italic;font-weight:900}[dir=rtl] .dlg h2{font-style:normal;text-transform:none}

.ck{display:inline;font-size:19px}
.acts>*{margin:0 10px 8px 0}[dir=rtl] .acts>*{margin:0 0 8px 10px}
.dlg p,.hint{color:var(--dim);font-size:16px;margin:0 0 12px}
.glass p{color:var(--dim);font-size:16px;margin:0}
.glass .row{margin:14px 0 0}.glass .row>label{display:block;color:var(--dim);font-size:16px;margin-bottom:6px}
.glass .row select,.glass .row input[type=text]{width:100%}
.lk{display:block;padding:8px 12px;border-radius:12px;border:1px solid transparent;margin-bottom:4px;cursor:pointer}
.lk.on{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.2)}

        n.root.appendChild(h('div', { 'class': 'r1' }, [n.chip, n.name])); n.root.appendChild(h('div', { 'class': 'bar' }, [n.fill]));
        n.root.appendChild(n.meta); n.root.appendChild(n.url); n.root.appendChild(n.err); n.root.appendChild(n.btns);
      }
      var pct = it.total > 0 ? Math.min(100, it.done * 100 / it.total) : (it.state === 'done' ? 100 : 0);
      n.name.textContent = it.name; n.chip.textContent = t('st_' + it.state); n.chip.className = 'chip ' + it.state;
      n.root.className = 'item s-' + it.state; n.fill.style.width = pct.toFixed(1) + '%';
      var m = fmtB(it.done) + (it.total > 0 ? ' / ' + fmtB(it.total) + '  (' + pct.toFixed(1) + '%)' : '');
      if (it.state === 'active') m += '   \u2193 ' + fmtB(it.speed) + '/s' + (it.eta >= 0 ? '   ' + t('m_eta') + ' ' + fmtT(it.eta) : '') + '   ' + it.segs + ' ' + t('m_conn');
      if (it.state === 'queued') m += '   ' + t('m_waiting', { name: qname(it.q) });
      if (it.state === 'done') m = fmtB(it.total) + '  \u2022  ' + t('m_saved', { dir: it.dir });
      if (it.state !== 'done' && it.state !== 'active' && it.total > 0 && !it.resumable) m += '   ' + t('m_noresume');
      n.meta.textContent = m; n.url.textContent = it.url; n.err.textContent = it.err || '';
      var sig = it.state + '|' + st.queues.length + '|' + st.queues.map(function (z) { return z.name; }).join(',');
      if (sig !== n.sig) { n.sig = sig; buildBtns(n.btns, it); }
      var want = prev ? prev.nextSibling : list.firstChild;
      if (n.root !== want || n.root.parentNode !== list) list.insertBefore(n.root, want);
      prev = n.root;
    });
    for (var k in itemNodes) if (!seen[k]) { if (itemNodes[k].root.parentNode) itemNodes[k].root.parentNode.removeChild(itemNodes[k].root); delete itemNodes[k]; }
    var emp = $('empty');
    if (!order.length) { if (!emp) { var big = h('span', { 'class': 'big' }); big.appendChild(ico('dl', true));
        list.appendChild(h('div', { 'class': 'empty', id: 'empty' }, [big, h('b', { text: t('empty_title') }), h('span', { text: t('empty_msg') })])); } }
    else if (emp) list.removeChild(emp);
  }

  /* ----- add links dialog (queue + one "save to" folder) ----- */
  function addDlg(prefill) {
    var ta = h('textarea', { rows: 6, placeholder: 'https://example.com/file.zip\nhttps://example.com/other.iso|Custom name.iso' }); if (prefill) ta.value = prefill;
    var qs = h('select'); st.queues.forEach(function (z) { qs.appendChild(h('option', { value: z.id, text: z.name })); }); qs.value = curQ || 1;
    var box = { val: st.settings.dir };
    openDlg([h('h2', { text: prefill ? t('add_received') : t('add_title') }), h('p', { text: prefill ? t('add_received_hint') : t('add_hint') }), ta, h('div', { style: 'height:14px' }),
      row(t('add_queue'), qs), folderRow(t('add_saveto'), box),
      acts([btn('', t('add_go'), 'pri', function () {
        var lines = ta.value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l && l[0] !== '#'; });
        if (!lines.length) { toast(t('add_empty'), 'err'); return; }
        var qp = 'q=' + qs.value + '&dir=' + q(box.val);
        if (lines.length === 1) { var p = lines[0].split('|'); post('/api/add?url=' + q(p[0]) + (p[1] ? '&name=' + q(p[1]) : '') + '&' + qp, function (j) { if (j && j.ok) { toast(j.dup === 1 ? t('dup_listed') : j.dup === 2 ? t('dup_done') : t('added_one'), j.dup === 1 ? 'err' : 'ok'); closeDlg(); } }); }
        else api('POST', '/api/bulk?' + qp, lines.join('\n'), function (s, j) { poll(); if (j && j.ok) { toast(t('added_n', { n: j.added }) + (j.dups ? ', ' + t('dups_n', { n: j.dups }) : '') + (j.rejected ? ', ' + t('rejected_n', { n: j.rejected }) : ''), j.rejected ? 'err' : 'ok'); closeDlg(); } else toast(t('err_request'), 'err'); });
      }), cancelBtn()])]);
  }
  function timeSel(min) {
    var hh = h('select'), mm = h('select'), i, wrap = h('span');
    for (i = 0; i < 24; i++) hh.appendChild(h('option', { value: i, text: (i < 10 ? '0' : '') + i }));
    for (i = 0; i < 60; i += 5) mm.appendChild(h('option', { value: i, text: (i < 10 ? '0' : '') + i }));
    if (min % 5) mm.appendChild(h('option', { value: min % 60, text: ((min % 60) < 10 ? '0' : '') + (min % 60) }));
    hh.value = Math.floor(min / 60); mm.value = min % 60;
    wrap.appendChild(hh); wrap.appendChild(document.createTextNode(' : ')); wrap.appendChild(mm);
    wrap.val = function () { return parseInt(hh.value, 10) * 60 + parseInt(mm.value, 10); };
    return wrap;
  }
  function timerDlg(qq) {
    var on = h('input', { type: 'checkbox' }); on.checked = !!qq.sched_on;
    var t1 = timeSel(qq.sched_on ? qq.start : 60), t2 = timeSel(qq.sched_on ? qq.stop : 420);
    openDlg([h('h2', { text: t('timer_title', { name: qq.name }) }), h('div', { 'class': 'row' }, [on, h('span', { 'class': 'ck', text: t('timer_enable') })]),
      row(t('timer_start'), t1, 'inl'), row(t('timer_stop'), t2, 'inl'), h('p', { text: t('timer_hint') }),
      acts([btn('', t('save'), 'pri', function () {
        post('/api/queue?act=sched&id=' + qq.id + '&on=' + (on.checked ? 1 : 0) + '&start=' + t1.val() + '&stop=' + t2.val() + '&tz=' + new Date().getTimezoneOffset(), function (j) { if (j && j.ok) { toast(t('timer_saved')); closeDlg(); } });
      }), cancelBtn()])]);
  }

  /* ----- link grabber (a page of its own; results survive switching tabs) ----- */
  var G = { url: '', links: [], sel: {}, showAll: false, filt: '', status: '', q: 0, box: null };
  function buildGrab(view) {
    if (!G.box) G.box = { val: st ? st.settings.dir : '' };
    var url = h('input', { type: 'text', placeholder: 'https://example.com/downloads' }); url.value = G.url;
    var status = h('p', { text: G.status || t('grab_hint') });
    var box = h('div', { id: 'lkbox' }), results = h('div'), addB = btn('', '', 'pri', addSel);
    var all = h('input', { type: 'checkbox' }), fi = h('input', { type: 'text', placeholder: t('grab_filter_ph') }); all.checked = G.showAll; fi.value = G.filt;
    var qs = h('select'); st.queues.forEach(function (z) { qs.appendChild(h('option', { value: z.id, text: z.name })); }); qs.value = G.q || curQ || 1;
    qs.addEventListener('change', function () { G.q = parseInt(qs.value, 10); });
    var scanB = btn('search', t('grab_scan'), 'pri', scan);
    results.style.display = G.links.length ? 'block' : 'none';
    function visible() { var f = G.filt.toLowerCase(); return G.links.filter(function (l) { return (G.showAll || l.f) && (!f || l.u.toLowerCase().indexOf(f) > -1); }); }
    function count() { var n = 0; for (var k in G.sel) if (G.sel[k]) n++; return n; }
    function label() { addB.textContent = t('grab_add', { n: count() }); }
    function draw() {
      var v = visible(), shown = v.slice(0, 200); box.innerHTML = '';
      shown.forEach(function (l) {
        var cb = h('input', { type: 'checkbox' }); cb.checked = !!G.sel[l.u];
        var r = h('label', { 'class': 'lk' + (G.sel[l.u] ? ' on' : '') }, [cb, h('b', { text: l.n }), h('small', { text: l.u })]);
        cb.addEventListener('change', function () { G.sel[l.u] = cb.checked ? 1 : 0; r.className = 'lk' + (cb.checked ? ' on' : ''); label(); });
        box.appendChild(r);
      });
      if (!shown.length) box.appendChild(h('p', { text: G.showAll ? t('grab_none_match') : t('grab_none_files') }));
      if (v.length > shown.length) box.appendChild(h('p', { text: t('grab_more', { shown: shown.length, n: v.length }) }));
      label();
    }
    function scan() {
      var u = url.value.trim(); if (!u) { toast(t('grab_need_url'), 'err'); return; }
      if (!/^https?:\/\//i.test(u)) { u = 'https://' + u; url.value = u; }
      G.url = u; status.textContent = t('grab_loading'); scanB.disabled = true;
      api('POST', '/api/scan?url=' + q(u), null, function (s, j) {
        scanB.disabled = false;
        if (s !== 200 || !j || !j.ok) { G.status = (j && j.error) || t('grab_failed'); status.textContent = G.status; return; }
        G.links = j.links; G.sel = {}; var nf = 0; G.links.forEach(function (l) { if (l.f) { G.sel[l.u] = 1; nf++; } });
        G.showAll = !nf; all.checked = G.showAll; G.filt = ''; fi.value = '';
        G.status = t('grab_found', { n: j.total || G.links.length, f: nf }) + (j.truncated ? ' ' + t('grab_cut') : '') + (nf ? ' ' + t('grab_tick') : '') + (!nf && j.diag ? ' ' + t('grab_diag', { code: j.diag.code, kb: Math.round(j.diag.bytes / 1024), title: j.diag.title || '-' }) : ''); status.textContent = G.status;
        results.style.display = 'block'; draw();
      });
    }
    function addSel() {
      var urls = []; G.links.forEach(function (l) { if (G.sel[l.u]) urls.push(l.u.replace(/\|/g, '%7C')); });
      if (!urls.length) { toast(t('grab_tick_one'), 'err'); return; }
      api('POST', '/api/bulk?q=' + qs.value + '&dir=' + q(G.box.val), urls.join('\n'), function (s, j) {
        poll(); if (j && j.ok) { toast(t('added_n', { n: j.added }) + (j.dups ? ', ' + t('dups_n', { n: j.dups }) : '') + (j.rejected ? ', ' + t('rejected_n', { n: j.rejected }) : ''), j.rejected ? 'err' : 'ok'); } else toast(t('err_request'), 'err'); });
    }
    all.addEventListener('change', function () { G.showAll = all.checked; draw(); });
    fi.addEventListener('input', function () { G.filt = fi.value; draw(); });
    url.addEventListener('keydown', function (e) { if (e.keyCode === 13) scan(); });
    view.appendChild(pageHead(t('grab_title'), t('grab_sub')));
    view.appendChild(h('div', { 'class': 'glass' }, [h('div', { 'class': 'srch' }, [url, scanB]), h('div', { style: 'height:12px' }), status]));
    results.appendChild(h('div', { 'class': 'glass' }, [
      h('div', { 'class': 'acts' }, [ib('', t('grab_all'), '', function () { visible().forEach(function (l) { G.sel[l.u] = 1; }); draw(); }), ib('', t('grab_none'), '', function () { G.sel = {}; draw(); })]), h('div', { style: 'height:10px' }),
      box,
      h('div', { 'class': 'row' }, [all, h('span', { 'class': 'ck', text: t('grab_show_all') })]), row(t('grab_filter'), fi),
      row(t('add_queue'), qs), folderRow(t('add_saveto'), G.box), h('div', { style: 'height:14px' }), addB]));
    view.appendChild(results);
    if (G.links.length) draw();
  }

  /* ----- settings (rows like PLDMGR) ----- */
  function setRow(icon, title, desc, ctl, cls) {
    var si = h('div', { 'class': 'si' }); si.appendChild(ico(icon));
    return h('div', { 'class': 'srow' + (cls ? ' ' + cls : '') }, [h('div', { 'class': 'r1', style: '-webkit-flex:1;flex:1;min-width:260px' }, [si, h('div', { 'class': 'tx' }, [h('b', { text: title }), h('span', { text: desc })])]), h('div', { 'class': 'ctl' }, [ctl])]);
  }
  function buildSettings(view) {
    var S = st.settings, n;
    var seg = h('select'); for (n = 1; n <= 8; n++) seg.appendChild(h('option', { value: n, text: n + (n === 4 ? ' ' + t('set_recommended') : '') })); seg.value = S.segments;
    var lim = h('input', { type: 'number', min: 0, value: S.limit_kbps }), ret = h('input', { type: 'number', min: 0, max: 20, value: S.retries });
    var nt = h('select'); [['0', t('notify_off')], ['1', t('notify_queue')], ['2', t('notify_all')]].forEach(function (o) { nt.appendChild(h('option', { value: o[0], text: o[1] })); }); nt.value = String(S.notify === undefined ? 2 : S.notify);
    var box = { val: S.dir }, path = h('div', { 'class': 'path', text: box.val });
    var pick = btn('folder', t('fm_choose'), '', function () { pickFolder(box.val, function (p) { box.val = p; path.textContent = p; }); });
    view.appendChild(pageHead(t('set_title'), t('set_sub')));
    view.appendChild(h('div', { 'class': 'sec' }, [h('span', { text: t('set_sec_dl') })]));
    view.appendChild(setRow('layers', t('set_segments'), t('set_segments_d'), seg));
    view.appendChild(setRow('speed', t('set_limit'), t('set_limit_d'), lim));
    view.appendChild(setRow('repeat', t('set_retries'), t('set_retries_d'), ret));
    view.appendChild(setRow('speed', t('set_notify'), t('set_notify_d'), nt));
    view.appendChild(setRow('folder', t('set_folder'), t('set_folder_d'), h('div', {}, [path, pick])));
    view.appendChild(h('div', { 'class': 'acts', style: 'margin:6px 0 24px' }, [btn('', t('save'), 'pri', function () {
      post('/api/settings?segments=' + seg.value + '&limit_kbps=' + (parseInt(lim.value, 10) || 0) + '&retries=' + (parseInt(ret.value, 10) || 0) + '&notify=' + nt.value + '&dir=' + q(box.val), function (j) { if (j && j.ok) toast(t('saved')); });
    })]));
    view.appendChild(h('div', { 'class': 'sec' }, [h('span', { text: t('set_sec_app') })]));
    var ls = h('select'); Object.keys(I).sort().forEach(function (c) { ls.appendChild(h('option', { value: c, text: NAMES[c] || c.toUpperCase() })); }); ls.value = lang;
    ls.addEventListener('change', function () { try { localStorage.setItem('dlmgr_lang', ls.value); } catch (e) {} location.reload(); });
    view.appendChild(setRow('globe', t('set_language'), t('set_language_d'), ls));
    view.appendChild(setRow('power', t('set_exit'), t('set_exit_d'), btn('power', t('nav_exit'), 'bad', exitDlg), 'dz'));
    view.appendChild(h('p', { 'class': 'hint', text: t('app_name') + ' v' + st.version }));
  }

  document.addEventListener('keydown', function (e) { if (e.keyCode === 27) closeTop(); });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeDlg(); });
  $('modal2').addEventListener('click', function (e) { if (e.target === $('modal2')) $('modal2').className = 'modal'; });

  /* /add?...&ask=1 redirects here with ?add=<link>: open the Add dialog so the user picks queue and folder */
  var m = /[?&]add=([^&]+)/.exec(location.search);
  if (m) { try { pendingAdd = decodeURIComponent(m[1]); } catch (e) {} if (window.history && history.replaceState) history.replaceState(null, '', location.pathname); }
  $('bname').textContent = t('app_name');
  poll(); pollTimer = setInterval(poll, 1000);
  if (location.search.indexOf('error=1') > -1) toast(t('err_link_rejected'), 'err');
})();
