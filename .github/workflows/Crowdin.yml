name: Crowdin sync
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [master]
    paths: ["frontend/locales/en.json"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crowdin/github-action@v2
        with:
          source: frontend/locales/en.json
          translation: frontend/locales/%two_letters_code%.json
          upload_sources: true
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Commit translations
        run: |
          git config user.name "crowdin-bot"
          git config user.email "crowdin-bot@users.noreply.github.com"
          git add frontend/locales
          git diff --cached --quiet || (git commit -m "i18n: update translations" && git push)
